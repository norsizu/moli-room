<script>

/* chamfered box: every edge gets a crisp 45° facet */
const geoCache = new Map();

function ell(rx, ry, rz, mat, x, y, z, p, seg = [10, 7], s) {

const cyl = (rt, rb, h, n, mat, x, y, z, p, s) => mesh(new THREE.CylinderGeometry(rt, rb, h, n), mat, x, y, z, p, s);
function canvasTex(w, h, draw) {

    const w = Math.max(W * 0.04, W * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.8)), 0.9));

  for (let i = 0; i < o.n; i++) {

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); sizePost();
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 42 : 34; camera.updateProjectionMatrix();
});
if (/[?&]night/.test(location.search)) { override = 1; tod = 1; nightBtn(); }
if (/[?&]lamp/.test(location.search)) { toggleLamp(); lampK = 1; }

/* ---------- go ---------- */
resetView();
scene.updateMatrixWorld(true);
const clk = new THREE.Clock();
snapTo(desiredAct()); tvOn = tvWanted() ? 1 : 0;
window.MOLI_DEBUG = { summonAura, aura, holo, auraDev, radio, tvMusic, arcade, amb, controls, cat, catWalk, catBody, moli, rig, life, cs, rb, ITEMS, command, startRobot, catGo, camera, moliShadow, scene, update, robot, body, blanket, jelly, win, bd, fireflies, world, W };
drawTV(0, false);
if (Q.has('play')) arcade.debugStart(parseInt(Q.get('play'), 10) || 3);

if (Q.has('blocks')) arcade.debugExt('blocks', Q.get('blocks'));

if (Q.has('tv') || Q.has('play') || Q.has('contra') || Q.has('blocks') || Q.has('circus')) enterTV(true);

if (Q.has('cam')) { const v = Q.get('cam').split(',').map(Number); camera.position.set(v[0], v[1], v[2]); controls.target.set(v[3], v[4], v[5]); controls.update(); }
if (window.LOADER) LOADER.finish(); else document.getElementById('loading').hidden = true;
(function loop() {
  const dt = Math.min(clk.getDelta(), 0.05);
  update(dt); if (tvMode === 0) controls.update(); composer.render(dt);
  requestAnimationFrame(loop);
})();
}
if (window.LOADER) LOADER.scriptsDone();
Promise.race([
  document.fonts ? Promise.all([document.fonts.load('40px "ZCOOL QingKe HuangYou"', '一滴墨水茉莉MOLINK嗨喵超级即将推出游戏卡带'), document.fonts.load('8px "Press Start 2P"')]) : Promise.resolve(),
  new Promise(r => setTimeout(r, 2500)),
]).catch(() => {}).then(() => { if (window.LOADER) LOADER.fontsDone(); setTimeout(start, 60); });
